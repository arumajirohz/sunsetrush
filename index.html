<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#05070f">
  <meta name="description" content="SUNSET RUSH — a fast arcade WebGL racing game.">
  <title>SUNSET RUSH — 落日狂飙</title>
  <style>
    :root{
      --bg:#05070f;
      --bg2:#0b0f1a;
      --panel:rgba(9,13,28,.78);
      --line:#2b3350;
      --amber:#ffb03a;
      --gold:#ffd23f;
      --cyan:#41e0ff;
      --text:#f2f5ff;
      --dim:#9aa3c0;
      --fd:'Arial Black','Segoe UI',sans-serif;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',sans-serif;color:var(--text)}
    body{
      min-height:100vh;
      display:grid;
      place-items:center;
      overflow:hidden;
      background:
        radial-gradient(circle at 50% 20%,rgba(255,176,58,.16),transparent 34%),
        radial-gradient(circle at 80% 80%,rgba(65,224,255,.08),transparent 28%),
        linear-gradient(160deg,var(--bg),var(--bg2));
    }
    .noise{position:fixed;inset:0;pointer-events:none;opacity:.08;background-image:radial-gradient(#fff .6px,transparent .6px);background-size:4px 4px}
    .wrap{width:min(920px,92vw);padding:28px}
    .panel{
      position:relative;
      padding:clamp(34px,7vw,78px) clamp(24px,7vw,76px);
      background:linear-gradient(180deg,rgba(15,21,40,.88),rgba(7,11,24,.84));
      border:1px solid var(--line);
      box-shadow:0 30px 90px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.04);
      overflow:hidden;
    }
    .panel:before{content:'';position:absolute;inset:14px;border:1px solid rgba(255,176,58,.16);pointer-events:none}
    .eyebrow{font:700 12px/1 var(--fd);letter-spacing:5px;color:var(--cyan);text-transform:uppercase;margin-bottom:18px}
    h1{margin:0;font:900 clamp(48px,10vw,104px)/.9 var(--fd);letter-spacing:4px;color:#fff;text-shadow:0 5px 0 rgba(0,0,0,.3)}
    h1 span{display:block;color:var(--gold);font-size:.38em;letter-spacing:9px;margin-top:18px}
    .tagline{max-width:620px;margin:24px 0 30px;color:#cbd3ea;font-size:clamp(15px,2.1vw,19px);line-height:1.55}
    .start{
      display:inline-flex;align-items:center;justify-content:center;gap:12px;
      min-width:240px;padding:18px 34px;
      background:var(--amber);color:#241503;border:2px solid #241503;
      box-shadow:0 6px 0 #9f620d,0 16px 32px rgba(0,0,0,.35);
      text-decoration:none;font:900 20px/1 var(--fd);letter-spacing:2px;
      transition:transform .12s ease,filter .15s ease,box-shadow .12s ease;
    }
    .start:hover{filter:brightness(1.08);transform:translateY(-2px)}
    .start:active{transform:translateY(5px);box-shadow:0 1px 0 #9f620d}
    .arrow{font-size:24px}
    .features{display:flex;flex-wrap:wrap;gap:10px;margin-top:34px}
    .chip{padding:8px 12px;border:1px solid var(--line);background:rgba(21,27,48,.72);color:var(--dim);font-size:12px}
    .chip b{color:var(--text)}
    .corner{position:absolute;right:24px;top:22px;color:rgba(255,255,255,.35);font:700 11px var(--fd);letter-spacing:3px}
    .footer{margin-top:14px;color:#68738f;font-size:11px;text-align:center;letter-spacing:1px}
    @media(max-width:620px){
      body{overflow:auto}
      .wrap{padding:16px}
      .panel{padding:34px 24px 30px}
      h1{letter-spacing:2px}
      h1 span{letter-spacing:5px}
      .start{width:100%;min-width:0}
      .features{gap:8px}
      .corner{right:18px;top:16px}
    }
  </style>
</head>
<body>
  <div class="noise"></div>
  <main class="wrap">
    <section class="panel">
      <div class="corner">G66 · 001</div>
      <div class="eyebrow">ARCADE WEBGL RACER</div>
      <h1>SUNSET RUSH<span>落日狂飙</span></h1>
      <p class="tagline">Push the throttle, weave through traffic, chain near misses, and burn the road from sunset into the night.</p>
      <a class="start" href="SUNSET_RUSH.html"><span class="arrow">▶</span> HIT START</a>
      <div class="features">
        <div class="chip"><b>← → / A D</b> steer</div>
        <div class="chip"><b>SPACE / N₂O</b> boost</div>
        <div class="chip"><b>S</b> brake</div>
        <div class="chip"><b>P / ESC</b> pause</div>
        <div class="chip"><b>Touch</b> supported</div>
      </div>
    </section>
    <div class="footer">SUNSET RUSH · Open the game to begin</div>
  </main>
</body>
</html>
