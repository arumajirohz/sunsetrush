<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SUNSET RUSH — 落日狂飙</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070f;
      font-family: Arial, sans-serif;
      color: #fff;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .screen {
      width: min(100%, 1100px);
      min-height: 100vh;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
    }

    .route {
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 4px;
      color: #fff;
      background: #c8322b;
      border: 2px solid #fff;
      padding: 6px 16px;
      margin-bottom: 20px;
      box-shadow: 0 5px 0 rgba(0,0,0,.35);
    }

    h1 {
      font-size: clamp(48px, 10vw, 110px);
      font-weight: 900;
      letter-spacing: 6px;
      color: #fff;
      text-shadow:
        0 5px 0 #7a321d,
        0 14px 35px rgba(0,0,0,.55);
    }

    .subtitle {
      margin-top: 10px;
      font-size: clamp(13px, 2vw, 20px);
      letter-spacing: 6px;
      color: #ffd23f;
    }

    .description {
      max-width: 650px;
      margin-top: 24px;
      color: #9aa3c0;
      font-size: 15px;
      line-height: 1.7;
    }

    .start {
      margin-top: 36px;
      padding: 18px 50px;
      border: 3px solid #2a1804;
      background: #ffb03a;
      color: #2a1804;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 3px;
      text-decoration: none;
      cursor: pointer;
      box-shadow:
        0 6px 0 #a8650e,
        0 18px 35px rgba(0,0,0,.45);
      transition:
        transform .12s ease,
        filter .12s ease,
        box-shadow .12s ease;
    }

    .start:hover {
      filter: brightness(1.12);
      transform: translateY(-2px);
    }

    .start:active {
      transform: translateY(5px);
      box-shadow:
        0 1px 0 #a8650e,
        0 8px 20px rgba(0,0,0,.4);
    }

    .controls {
      margin-top: 28px;
      color: #737d9c;
      font-size: 12px;
      letter-spacing: 1px;
    }

    .road {
      position: absolute;
      left: 0;
      right: 0;
      bottom: -20%;
      height: 45%;
      background:
        linear-gradient(
          90deg,
          transparent 0 15%,
          rgba(255,255,255,.04) 15% 15.3%,
          transparent 15.3% 84.7%,
          rgba(255,255,255,.04) 84.7% 85%,
          transparent 85%
        ),
        linear-gradient(
          #111827,
          #05070f
        );
      transform: perspective(500px) rotateX(60deg);
      transform-origin: bottom;
      pointer-events: none;
      opacity: .8;
    }

    .glow {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(255,176,58,.15),
        transparent 70%
      );
      pointer-events: none;
    }

    @media (max-width: 600px) {
      .screen {
        padding: 24px;
      }

      .description {
        font-size: 13px;
      }

      .start {
        padding: 16px 36px;
        font-size: 18px;
      }

      .controls {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>
  <div class="screen">

    <div class="glow"></div>
    <div class="road"></div>

    <div class="route">G66</div>

    <h1>SUNSET RUSH</h1>

    <div class="subtitle">
      落日狂飙 · LANDSCAPE RACER
    </div>

    <div class="description">
      A fast-paced sunset highway racing experience.
      Dodge traffic, chain near misses, hit ramps,
      collect nitro and push your score higher.
    </div>

    <a class="start" href="game.html">
      HIT START
    </a>

    <div class="controls">
      ← → / A D · STEER &nbsp; • &nbsp;
      SPACE · NITRO &nbsp; • &nbsp;
      S · BRAKE
    </div>

  </div>
</body>
</html>
