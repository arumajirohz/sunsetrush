<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<title>落日狂飙 · SUNSET RUSH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0c1020; --panel:rgba(13,17,32,.88); --line:#2b3350;
  --amber:#ffb03a; --gold:#ffd23f; --cyan:#41e0ff; --red:#ff5040;
  --text:#f2f5ff; --dim:#9aa3c0;
  --fd:'Russo One','PingFang SC','Microsoft YaHei',sans-serif;
  --fb:-apple-system,'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{position:fixed;inset:0;overflow:hidden;background:#05070f;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#app{position:fixed;left:0;top:0;overflow:hidden;touch-action:none;font-family:var(--fb);color:var(--text)}
#stage{position:absolute;inset:0}
#stage canvas{display:block}

/* 矢量图标 */
.ic{width:1em;height:1em;display:inline-block;vertical-align:-.15em;fill:none;stroke:currentColor;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ibtn .ic{width:19px;height:19px}
.tbtn .ic{width:34px;height:34px;stroke-width:2.6}
.chip b .ic,.keys b .ic{vertical-align:-.12em}

/* ── HUD ─ */
#hud{position:absolute;inset:0;pointer-events:none;z-index:5}
.plate{background:var(--panel);border:1px solid var(--line);box-shadow:0 4px 0 rgba(0,0,0,.35);
  transform:skewX(-8deg);padding:6px 16px}
.plate>span,.plate>b,.plate>i{display:inline-block;transform:skewX(8deg)}
#hudTL{position:absolute;left:14px;top:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
#scoreBox b{font-family:var(--fd);font-size:30px;color:var(--gold);letter-spacing:1px;text-shadow:0 2px 10px rgba(0,0,0,.7)}
#scoreBox i{font-style:normal;font-size:11px;color:var(--dim);margin-right:8px;letter-spacing:2px}
#comboBox{display:none;background:#3a1608e0;border-color:#8a4a12}
#comboBox b{font-family:var(--fd);color:var(--amber);font-size:16px}
#comboBox.pop{animation:pop .3s ease}
@keyframes pop{40%{transform:skewX(-8deg) scale(1.22)}}
#shieldBox{display:none;background:#062a38e0;border-color:#1c6e8a}
#shieldBox b{color:var(--cyan);font-size:14px}
#hudTR{position:absolute;right:14px;top:12px;display:flex;gap:8px;align-items:flex-start}
#hudTR .plate b{font-family:var(--fd);font-size:15px;color:var(--text)}
#hudTR .plate i{font-style:normal;font-size:10px;color:var(--dim);margin-right:6px}
.ibtn{pointer-events:auto;min-width:42px;height:42px;padding:0 10px;background:var(--panel);border:1px solid var(--line);
  color:var(--text);font-size:15px;font-family:var(--fd);box-shadow:0 4px 0 rgba(0,0,0,.35);cursor:pointer;
  transition:transform .1s,border-color .15s,color .15s;touch-action:manipulation;
  display:flex;align-items:center;justify-content:center}
.ibtn:active{transform:translateY(3px)}

/* 速度表 */
#cluster{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);text-align:center}
#gauge{filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}
#spdRow{margin-top:-14px}
#spd{font-family:var(--fd);font-size:30px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.8);line-height:1}
#spdRow small{color:var(--dim);font-size:10px;letter-spacing:2px;margin-left:4px}

/* 氮气 */
#nitroWrap{position:absolute;right:16px;bottom:118px;width:132px}
#nitroBar{height:12px;border:1px solid #2b4a58;background:#0a1220;position:relative;overflow:hidden}
#nitroFill{height:100%;width:0%;background:var(--cyan);box-shadow:0 0 12px var(--cyan);transition:width .15s}
#nitroBar::after{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,transparent 0 9px,#0a1220 9px 11px)}
#nitroWrap label{font-size:10px;color:var(--cyan);letter-spacing:3px;font-family:var(--fd)}

/* 触屏按键 */
.tbtn{pointer-events:auto;position:absolute;width:78px;height:78px;border-radius:20px;
  background:rgba(18,24,46,.6);border:2px solid rgba(255,255,255,.28);color:#fff;
  font-size:30px;font-family:var(--fd);display:flex;align-items:center;justify-content:center;
  box-shadow:0 5px 0 rgba(0,0,0,.4);transition:transform .08s,background .08s;z-index:10;touch-action:none}
.tbtn:active,.tbtn.on{transform:scale(.93);background:rgba(255,176,58,.45);border-color:var(--amber)}
#t-left{left:16px;bottom:16px}
#t-right{left:106px;bottom:16px}
#t-brake{right:126px;bottom:26px;width:58px;height:58px;border-radius:50%}
#t-nitro{right:14px;bottom:14px;width:96px;height:96px;border-radius:50%;
  border-color:var(--cyan);color:var(--cyan);font-size:22px;text-shadow:0 0 10px var(--cyan)}
#t-nitro.ready{animation:npulse 1.1s infinite}
#t-nitro.empty{opacity:.35;animation:none}
#t-nitro:active,#t-nitro.on{background:rgba(65,224,255,.35)}
@keyframes npulse{50%{box-shadow:0 0 26px var(--cyan),0 5px 0 rgba(0,0,0,.4)}}

/* 漂浮字 / 提示 / 横幅 */
#floaters{position:absolute;inset:0;pointer-events:none;z-index:8;overflow:hidden}
.fl{position:absolute;font-family:var(--fd);font-size:20px;transform:translate(-50%,0);
  text-shadow:0 2px 6px rgba(0,0,0,.8);animation:flUp .95s ease-out forwards;white-space:nowrap}
.fl .ic{width:.9em;height:.9em}
.fl.gold{color:var(--gold)} .fl.cyan{color:var(--cyan)} .fl.red{color:var(--red)} .fl.white{color:#fff}
@keyframes flUp{to{transform:translate(-50%,-72px);opacity:0}}
#toast{position:absolute;top:64px;left:50%;transform:translateX(-50%);z-index:9;opacity:0;
  transition:opacity .25s;pointer-events:none;max-width:86%}
#toast.show{opacity:1}
#toast b{font-size:14px}
#toast .ic{vertical-align:-.14em}
#banner{position:absolute;top:110px;left:-460px;z-index:9;pointer-events:none;transition:left .5s cubic-bezier(.2,.9,.3,1)}
#banner.show{left:18px}
#banner .plate{border-left:6px solid var(--amber)}
#banner b{font-family:var(--fd);font-size:24px;color:#fff}
#banner i{display:block;font-style:normal;font-size:10px;color:var(--dim);letter-spacing:3px}

/* 倒计时 / 特效 */
#count{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:12;
  pointer-events:none;font-family:var(--fd);font-size:130px;color:var(--amber);
  text-shadow:0 0 30px rgba(255,176,58,.6),0 6px 0 #7a4a08}
#count.go{color:#7dff8a;text-shadow:0 0 30px rgba(90,255,120,.6),0 6px 0 #1a6a28}
#count.zoom{animation:cz .75s ease}
@keyframes cz{0%{transform:scale(2.2);opacity:0}25%{opacity:1}80%{transform:scale(1)}}
#vig{position:absolute;inset:0;pointer-events:none;z-index:4;
  background:radial-gradient(ellipse at center,transparent 58%,rgba(4,7,16,.5) 100%)}
#nitrofx{position:absolute;inset:0;pointer-events:none;z-index:4;opacity:0;transition:opacity .25s;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(65,224,255,.3) 100%)}
#nitrofx.on{opacity:1}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:11}
#flash.on{animation:fla .5s ease-out}
@keyframes fla{0%{opacity:.85}100%{opacity:0}}

/* ── 覆盖层 ── */
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(5,8,18,.55);z-index:20}
/* 主页：纯色干净背景，背后世界完全冻结 */
#menu{background:#0a0e1c}
.hide{display:none!important}
.abtn{pointer-events:auto;font-family:var(--fd);font-size:18px;letter-spacing:2px;cursor:pointer;
  background:var(--amber);color:#2a1804;border:2px solid #2a1804;padding:13px 30px;
  box-shadow:0 5px 0 #a8650e,0 10px 22px rgba(0,0,0,.45);
  transition:transform .08s,box-shadow .08s,filter .15s;touch-action:manipulation}
.abtn .ic{vertical-align:-.13em}
.abtn:active{transform:translateY(4px);box-shadow:0 1px 0 #a8650e}
.abtn.cyan{background:var(--cyan);color:#03222c;border-color:#03222c;box-shadow:0 5px 0 #1a8aa8,0 10px 22px rgba(0,0,0,.45)}
.abtn.cyan:active{box-shadow:0 1px 0 #1a8aa8}
.abtn.ghost{background:transparent;color:var(--text);border-color:var(--line);box-shadow:none}
.abtn.big{font-size:22px;padding:16px 40px}
@media(hover:hover){.abtn:hover{filter:brightness(1.12)}.ibtn:hover{border-color:var(--amber);color:var(--amber)}}

/* 开始界面：路牌风格 */
#menu .wrap{display:flex;gap:44px;align-items:center;padding:20px}
.sign{position:relative;background:#0b7a45;border:3px solid #eef7f0;border-radius:14px;
  padding:34px 44px 30px;transform:rotate(-2deg);box-shadow:0 18px 40px rgba(0,0,0,.5);text-align:center}
.sign::before{content:'';position:absolute;inset:7px;border:2px solid #eef7f0;border-radius:8px;pointer-events:none}
.sign .route{position:absolute;top:-20px;left:50%;transform:translateX(-50%);background:#c8322b;
  color:#fff;font-family:var(--fd);font-size:15px;padding:4px 14px;border:2px solid #fff;border-radius:6px}
.sign h1{font-family:var(--fd);font-size:56px;color:#fff;letter-spacing:6px;line-height:1.1;
  text-shadow:0 4px 0 rgba(0,0,0,.28)}
.sign .sub{font-family:var(--fd);color:var(--gold);font-size:15px;letter-spacing:5px;margin-top:8px}
.sign .posts{position:absolute;left:50%;bottom:-52px;transform:translateX(-50%);width:150px;height:52px}
.sign .posts::before,.sign .posts::after{content:'';position:absolute;top:0;width:12px;height:100%;
  background:linear-gradient(#8a9099,#5a6068)}
.sign .posts::before{left:14px}.sign .posts::after{right:14px}
.mside{display:flex;flex-direction:column;gap:16px;align-items:flex-start;max-width:340px}
.mside .best{font-size:14px}
.mside .best b{font-family:var(--fd);color:var(--gold);font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#151b30;border:1px solid var(--line);padding:6px 11px;font-size:12px;color:var(--dim);border-radius:4px}
.chip b{color:var(--text);font-family:var(--fd);font-weight:normal;margin-right:4px}
.hint{font-size:11px;color:var(--dim);line-height:1.7}
.hint .ic{width:.95em;height:.95em}

/* 结算 / 暂停面板 */
.panel{background:#101528f2;border:1px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.6);
  padding:30px 40px;min-width:340px;text-align:center}
.panel h2{font-family:var(--fd);font-size:34px;letter-spacing:3px;margin-bottom:4px}
.panel h2 .ic{width:.85em;height:.85em;vertical-align:-.06em}
.panel h2.red{color:var(--red)} .panel h2.amber{color:var(--amber)}
.panel .tag{font-size:11px;color:var(--dim);letter-spacing:3px;margin-bottom:18px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px 26px;margin:14px 0 20px;text-align:left}
.stats div{display:flex;justify-content:space-between;border-bottom:1px dashed #232b47;padding:5px 0;font-size:13px;color:var(--dim)}
.stats b{font-family:var(--fd);color:var(--text);font-weight:normal}
.bigscore{font-family:var(--fd);font-size:52px;color:var(--gold);text-shadow:0 0 24px rgba(255,210,63,.35);line-height:1}
.bigscore small{font-size:12px;color:var(--dim);letter-spacing:3px}
#newRec{display:none;color:var(--red);font-family:var(--fd);font-size:14px;letter-spacing:2px;margin-top:6px;animation:pop2 .6s infinite alternate}
@keyframes pop2{to{transform:scale(1.15)}}
.row{display:flex;gap:12px;justify-content:center;margin-top:18px}
.keys{font-size:12px;color:var(--dim);line-height:2;margin-top:14px;text-align:left}
.keys b{color:var(--text);background:#1a2138;border:1px solid var(--line);padding:1px 7px;border-radius:4px;font-family:var(--fd);font-weight:normal}
#err{color:var(--dim);font-size:14px;text-align:center;line-height:2}
#dbg{position:absolute;left:14px;bottom:104px;z-index:99;display:none;max-width:72%;
  font-size:11px;line-height:1.6;color:#ffb3ad;background:rgba(60,10,10,.88);
  border:1px solid #7a2a24;padding:6px 10px;pointer-events:none}
#dbg .ic{width:.95em;height:.95em}
#dbg.show{display:block}
@media (max-height:420px){ .sign h1{font-size:42px} .sign{padding:24px 34px 22px} }
</style>
</head>
<body oncontextmenu="return false">
<div id="app">
  <div id="stage"></div>
  <div id="vig"></div><div id="nitrofx"></div><div id="flash"></div>

  <div id="hud">
    <div id="hudTL">
      <div class="plate" id="scoreBox"><i data-i="score">SCORE</i><b id="score">0</b></div>
      <div class="plate" id="comboBox"><b id="comboV">连击 ×1.0</b></div>
      <div class="plate" id="shieldBox"><b data-i="shield">护盾就绪</b></div>
    </div>
    <div id="hudTR">
      <div class="plate"><i data-i="distHud">里程</i><b id="dist">0.00 km</b></div>
      <div class="plate"><i data-i="bestHud">最佳</i><b id="best">0</b></div>
      <button class="ibtn" id="btnLang">EN</button>
      <button class="ibtn" id="btnPause"></button>
      <button class="ibtn" id="btnMute"></button>
    </div>
    <div id="cluster">
      <svg id="gauge" width="132" height="76" viewBox="0 0 132 76">
        <path d="M12 66 A54 54 0 0 1 120 66" stroke="#232b47" stroke-width="10" fill="none" stroke-linecap="round"/>
        <path id="gArc" d="M12 66 A54 54 0 0 1 120 66" stroke="#ffb03a" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="169.6" stroke-dashoffset="169.6"/>
        <g id="gNeedle" transform="rotate(-90 66 66)"><line x1="66" y1="66" x2="66" y2="24" stroke="#ff5040" stroke-width="4" stroke-linecap="round"/></g>
        <circle cx="66" cy="66" r="6" fill="#ff5040"/>
      </svg>
      <div id="spdRow"><span id="spd">0</span><small>KM/H</small></div>
    </div>
    <div id="nitroWrap"><label>N₂O</label><div id="nitroBar"><div id="nitroFill"></div></div></div>
    <div id="t-left" class="tbtn"><svg class="ic" viewBox="0 0 24 24"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg></div>
    <div id="t-right" class="tbtn"><svg class="ic" viewBox="0 0 24 24"><path d="M9.5 5.5L16 12l-6.5 6.5"/></svg></div>
    <div id="t-brake" class="tbtn"><svg class="ic" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M4.5 7h15L12 19z"/></svg></div>
    <div id="t-nitro" class="tbtn">N₂O</div>
  </div>

  <div id="floaters"></div>
  <div class="plate" id="toast"><b id="toastV"></b></div>
  <div id="banner"><div class="plate"><b id="bannerV">海岸线</b><i id="bannerE">COAST HIGHWAY</i></div></div>
  <div id="count">3</div>

  <!-- 开始界面 -->
  <div class="ov" id="menu">
    <div class="wrap">
      <div class="sign"><div class="route">G66</div>
        <h1 data-i="title">落日狂飙</h1><div class="sub" data-i="sub">SUNSET RUSH · 横屏竞速</div>
        <div class="posts"></div>
      </div>
      <div class="mside">
        <div class="plate best"><span><span data-i="best">历史最佳</span> <b id="menuBest">0</b></span></div>
        <div class="chips">
          <div class="chip" data-i="chipSteer"></div>
          <div class="chip" data-i="chipNitro"></div>
          <div class="chip" data-i="chipBrake"></div>
          <div class="chip" data-i="chipPause"></div>
        </div>
        <button class="abtn big" id="btnStart" data-i="start">启动引擎</button>
        <div class="hint" data-i="hint">竖屏设备将自动旋转为横屏 · 建议开启声音<br>擦身而过攒连击，对向车道超车分数更高；跳台可飞越车流！</div>
      </div>
    </div>
  </div>

  <!-- 结算 -->
  <div class="ov hide" id="over">
    <div class="panel">
      <h2 class="red" data-i="over">撞毁了!</h2><div class="tag" data-i="overTag">WRECKED · 旅程结束</div>
      <div class="bigscore"><span id="goScore">0</span><br><small data-i="finalScore">最终得分</small></div>
      <div id="newRec" data-i="newRec">★ NEW RECORD 新纪录 ★</div>
      <div class="stats">
        <div><span data-i="stDist">里程</span><b id="goDist">0 km</b></div>
        <div><span data-i="stCoins">金币</span><b id="goCoins">0</b></div>
        <div><span data-i="stCombo">最高连击</span><b id="goCombo">×1.0</b></div>
        <div><span data-i="stMiss">擦身而过</span><b id="goMiss">0 次</b></div>
        <div><span data-i="stBest">历史最佳</span><b id="goBest">0</b></div>
        <div><span data-i="stSector">路段</span><b id="goBiome">-</b></div>
      </div>
      <div class="row">
        <button class="abtn cyan" id="btnAgain" data-i="again">再来一次</button>
        <button class="abtn ghost" id="btnHome" data-i="home">主页</button>
      </div>
    </div>
  </div>

  <!-- 暂停 -->
  <div class="ov hide" id="pauseOv">
    <div class="panel">
      <h2 class="amber" data-i="paused">已暂停</h2><div class="tag">PAUSED</div>
      <div class="keys" data-i="keys"></div>
      <div class="row">
        <button class="abtn" id="btnResume" data-i="resume">继续</button>
        <button class="abtn cyan" id="btnRestart" data-i="restart">重开</button>
        <button class="abtn ghost" id="btnHome2" data-i="home">主页</button>
      </div>
    </div>
  </div>

  <div class="ov hide" id="err"><div data-i="err">无法初始化 3D 引擎<br>需要网络加载 Three.js，或浏览器不支持 WebGL</div></div>
  <div id="dbg"></div>
</div>

<script>
(function(){'use strict';
const $=id=>document.getElementById(id);

/* ── 安全存储 ── */
const store=(()=>{const m={};let ok=false;
  try{localStorage.setItem('__t','1');localStorage.removeItem('__t');ok=true;}catch(e){}
  return{get(k){return ok?localStorage.getItem(k):m[k];},
         set(k,v){if(ok){try{localStorage.setItem(k,v);}catch(e){}}else m[k]=v;}};})();

/* ══════════ 矢量图标集 ══════════ */
const sv=p=>'<svg class="ic" viewBox="0 0 24 24">'+p+'</svg>';
const I={
 power:sv('<path d="M12 3v8"/><path d="M6.2 6.8a8 8 0 1 0 11.6 0"/>'),
 trophy:sv('<path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0zM7 5H4v2a3 3 0 0 0 3 3M17 5h3v2a3 3 0 0 1-3 3"/>'),
 shield:sv('<path d="M12 3l7 3v5.2c0 4.3-2.9 7.3-7 8.8-4.1-1.5-7-4.5-7-8.8V6z"/>'),
 flag:sv('<path d="M5 3v18M5 4h11l-2.6 3.5L16 11H5"/>'),
 warn:sv('<path d="M12 3.5L2.5 20h19zM12 9.5v4.5M12 17.2v.6"/>'),
 bolt:sv('<path fill="currentColor" stroke="none" d="M13 2L4.8 13.4h5.7L9.6 22l8.6-11.6h-5.9z"/>'),
 burst:sv('<path d="M12 2v4.5M12 17.5V22M2 12h4.5M17.5 12H22M5 5l3.2 3.2M15.8 15.8L19 19M19 5l-3.2 3.2M8.2 15.8L5 19"/>'),
 retry:sv('<path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1M20.5 2.5V7H16"/>'),
 home:sv('<path d="M3.5 11L12 3.5 20.5 11M6 9.8V20h12V9.8"/>'),
 play:sv('<path fill="currentColor" stroke="none" d="M7.5 4.5l12 7.5-12 7.5z"/>'),
 pause:sv('<path fill="currentColor" stroke="none" d="M7 4h3.3v16H7zM13.7 4H17v16h-3.7z"/>'),

const _c=new COL(),sunV=new V3(),moonV=new V3(.45,.6,-.65),lightV=new V3();

function applyPhase(ph){
  let i=0;while(i<KF.length-2&&ph>KF[i+1].p)i++;
  const a=KF[i],b=KF[i+1],f=clamp((ph-a.p)/(b.p-a.p),0,1);
  skyUni.uTop.value.copy(a.top).lerp(b.top,f);skyUni.uMid.value.copy(a.mid).lerp(b.mid,f);
  skyUni.uBot.value.copy(a.bot).lerp(b.bot,f);skyUni.uSunCol.value.copy(a.sun).lerp(b.sun,f);
  _c.copy(a.fog).lerp(b.fog,f);scene.fog.color.copy(_c);
  hemi.color.copy(a.hS).lerp(b.hS,f);hemi.groundColor.copy(a.hG).lerp(b.hG,f);
  dir.color.copy(a.dir).lerp(b.dir,f);dir.intensity=lerp(a.di,b.di,f);
  nightF=lerp(a.night,b.night,f);
  seaMat.color.copy(a.sea).lerp(b.sea,f);cloudMat.color.copy(a.cloud).lerp(b.cloud,f);
  let sunY;
  if(ph<.30)sunY=.38-ph/.30*.55;
  else if(ph<.84)sunY=-.2;
  else sunY=-.15+(ph-.84)/.16*.55;
  sunV.set(-.5,sunY,-.85).normalize();skyUni.uSunDir.value.copy(sunV);skyUni.uNight.value=nightF;
  sunDisc.visible=sunY>-.05;

    sunGlow.material.opacity=.9*sunDisc.material.opacity;}
  else sunGlow.material.opacity=0;
  moonDisc.visible=nightF>.25;
  if(moonDisc.visible){moonDisc.position.copy(moonV).multiplyScalar(560);moonDisc.lookAt(0,4,10);
    moonDisc.material.opacity=nightF;}
  lightV.copy(sunV).lerp(moonV,nightF).normalize();lightV.y=Math.max(lightV.y,.24);lightV.normalize();
  dir.position.copy(lightV).multiplyScalar(80);

  P.hlCone.material.opacity=.15*nightF;P.hlGlow.forEach(s=>s.material.opacity=.7*nightF);
  M.blinkRed.emissiveIntensity=nightF*(Math.sin(S.t*4)>0?2.2:.15);

const _v=new V3();
function updateWorld(dt,raw){
  S.t+=raw;skyUni.uTime.value=S.t;
  const playing=S.mode==='play';
  let base=Math.min(22+S.dist*.008,44);
  const brake=(keys.ArrowDown||keys.KeyS||touch.B)&&playing;
  S.nitroOn=playing&&(keys.Space||keys.ShiftLeft||keys.ShiftRight||touch.N)&&S.nitro>0&&!brake;
  let target=base*(S.nitroOn?1.55:1)+(playing&&(keys.ArrowUp||keys.KeyW)?2:0);
  if(brake)target=base*.35;
  if(S.mode==='count')target=0;
  if(S.mode==='crashed')target=0;
  const acc=S.nitroOn?26:(target>S.speed?13:30);
  S.speed+=clamp(target-S.speed,-acc*dt,acc*dt*(S.mode==='count'?3:1));
  if(S.nitroOn){S.nitro=Math.max(0,S.nitro-28*dt);if(S.nitro<=0)S.nitroOn=false;}
  const inL=keys.ArrowLeft||keys.KeyA||touch.L,inR=keys.ArrowRight||keys.KeyD||touch.R;
  let ix=(inR?1:0)-(inL?1:0);
  const air=S.py>0.05;
  S.pvx+=ix*(air?20:46)*dt;
  S.pvx*=Math.exp((air?-2:-8.5)*dt);
  S.px=clamp(S.px+S.pvx*dt,-5.55,5.55);
  if(Math.abs(S.px)>=5.55&&Math.abs(S.pvx)>2){S.pvx*=-.25;S.shake=Math.max(S.shake,.3);}
  if(S.py>0||S.vy>0){S.py+=S.vy*dt;S.vy-=22*dt;
    if(S.py<=0){S.py=0;S.vy=0;if(S.speed>8)sfx.thud();}}
  const ph=((S.dist/4200)+.015)%1;applyPhase(ph);
  if(playing){
    const nb=Math.floor(S.dist/1300)%4;
    if(nb!==S.biome){S.biome=nb;groundTarget.setHex(BIOMES[nb].ground);banner(BIOMES[nb]);}
    groundMat.color.lerp(groundTarget,1-Math.exp(-dt*.5));}
  const dz=S.speed*dt;
  asphaltTex.offset.y+=dz/7.14;dashTex.offset.y+=dz/12;shimmerTex.offset.y-=dt*.05;
  if(playing){S.dist+=dz;S.score+=dz*.5*mult();
    if(S.dist>=S.nextKm){S.score+=500;toast(I.flag+' '+(S.nextKm/1000)+' '+t('km')+'  +500');S.nextKm+=1000;}
    if(!S.oncomingOpen&&S.dist>600){S.oncomingOpen=true;toast(t('oncoming'));}}
  if(playing){
    S.decorAcc+=dz;let gap=9;
    while(S.decorAcc>gap){spawnDecor();S.decorAcc-=gap;gap=rnd(8,16);}
    S.lampAcc+=dz;if(S.lampAcc>32){spawnLamp();S.lampAcc-=32;}
    S.postAcc+=dz;if(S.postAcc>22){spawnPost();S.postAcc-=22;}
    S.trafT-=dt;if(S.trafT<=0){spawnTraffic(false);
      S.trafT=Math.max(.55,1.6-S.dist*.00025)*rnd(.7,1.3);}
    if(S.oncomingOpen){S.oncT-=dt;if(S.oncT<=0){spawnTraffic(true);S.oncT=rnd(2.6,4.5);}}
    S.coinAcc+=dz;if(S.coinAcc>rnd(180,260)){spawnCoins();S.coinAcc=0;}
    S.nitroAcc+=dz;if(S.nitroAcc>rnd(500,700)){spawnNitro();S.nitroAcc=0;}
    S.shieldAcc+=dz;if(S.shieldAcc>1500){spawnShield();S.shieldAcc=0;}
    S.rampAcc+=dz;if(S.rampAcc>rnd(850,1150)&&S.dist>300){spawnRamp();S.rampAcc=0;}
    if(S.biome===3&&Math.random()<dt*.25)spawnCone();}
  for(const type in decor)for(const it of decor[type]){if(!it.active)continue;
    it.g.position.z+=dz;if(it.g.position.z>60){it.active=false;it.g.visible=false;}
    else if(it.update)it.update(it,S.t,dt);}
  for(const p of posts){if(!p.active)continue;p.g.position.z+=dz;
    if(p.g.position.z>30){p.active=false;p.g.visible=false;}}
  for(const m of mounts){if(!m.active){m.m.position.set(rnd(-140,-70),0,-rnd(300,420));
      if(Math.random()<.3)m.m.position.x=rnd(110,160);
      const s=rnd(18,42);m.m.scale.set(s,s*rnd(.7,1.2),s);m.active=true;m.m.visible=true;}
    m.m.position.z+=dz*.12;if(m.m.position.z>90){m.active=false;m.m.visible=false;}}
  for(const c of clouds){if(!c.active){c.g.position.set(rnd(-130,130),rnd(38,68),-rnd(150,420));
      c.active=true;c.g.visible=true;}
    c.g.position.z+=dz*.22;c.g.position.x+=c.dx*dt;
    if(c.g.position.z>100||c.g.position.x>160){c.active=false;c.g.visible=false;}}
  const steerVis=clamp(S.pvx*.06,-.5,.5);
  P.steerL.rotation.y=steerVis;P.steerR.rotation.y=steerVis;
  const wspin=S.speed*dt/.35;
  P.wheels.forEach(w=>w.rotation.x-=wspin);
  for(const c of traffic){if(!c.active)continue;
    const rel=c.oncoming?S.speed+c.speed:S.speed-c.speed;
    if(c.dead){c.vy-=20*dt;c.y+=c.vy*dt;c.g.rotation.z+=c.spin*dt;c.g.rotation.y+=c.spin*.6*dt;
      c.z+=rel*dt*.4;if(c.y<0)c.y=0;c.g.position.set(c.x,c.y,c.z);
      if(c.z>50||(c.y<=0&&c.vy<0)){c.active=false;c.g.visible=false;}continue;}
    c.z+=rel*dt;
    if(!c.oncoming&&S.dist>500){
      if(c.changeT>0){c.changeT-=dt;
        const tx=LANES[c.targetLane];c.x+=clamp(tx-c.x,-2.4*dt,2.4*dt);
        c.blinkMat.emissiveIntensity=(Math.floor(S.t*6)%2)?2.4:.1;
        if(c.changeT<=0){c.lane=c.targetLane;c.blinkMat.emissiveIntensity=.1;}}
      else if(Math.random()<dt*.12){const d2=Math.random()<.5?-1:1,tl=c.lane+d2;
        if(tl>=1&&tl<=3){let free=true;
          for(const o of traffic)if(o.active&&!o.dead&&o.lane===tl&&Math.abs(o.z-c.z)<26)free=false;
          if(free){c.targetLane=tl;c.changeT=1.1;}}}}
    c.g.position.set(c.x,0,c.z);
    c.g.rotation.y=c.oncoming?Math.PI:clamp((LANES[c.lane]-c.x)*.15,-.3,.3);
    c.wheels.forEach(w=>w.rotation.x-=c.speed*dt/.4);
    if(c.coneMat)c.coneMat.opacity=.14*nightF;
    if(c.z>48||c.z<-260){c.active=false;c.g.visible=false;}
    if(playing){
      const dx=Math.abs(c.x-S.px),dzp=Math.abs(c.z);
      const hitX=dx<(c.wid+1.7)/2,hitZ=dzp<(c.len+4.1)/2;
      if(hitX&&hitZ&&S.py<=1.25&&S.invuln<=0){
        if(S.shield){S.shield=false;P.shield.visible=false;el.shieldBox.style.display='none';
          S.invuln=1.3;S.shake=Math.max(S.shake,.7);sfx.whoosh();sfx.thud();
          c.dead=true;c.vy=9;c.spin=rnd(-6,6);
          floater(_v.set(c.x,2,c.z),t('shieldBlock'),'cyan');}
        else crash(c);}
      if(!c.passed&&c.z>.4){c.passed=true;
        if(!c.dead&&S.invuln<=0){
          if(S.py>1.25&&dx<2.8){const v=Math.round(120*mult());S.score+=v;S.combo++;S.comboT=3.5;
            S.misses++;floater(_v.set(c.x,2.5,c.z),t('fly')+' +'+v,'cyan');sfx.whoosh();}
          else if(dx<3.3){const v=Math.round((c.oncoming?90:60)*mult());S.score+=v;
            S.combo++;S.comboT=3.5;S.misses++;
            floater(_v.set(c.x,1.8,c.z),t('miss')+' +'+v,'white');sfx.whoosh();}}}}}
  if(playing){
    S.invuln=Math.max(0,S.invuln-dt);
    P.tilt.visible=!(S.invuln>0&&Math.floor(S.t*12)%2);
    S.comboT-=dt;if(S.comboT<=0&&S.combo>0)S.combo=0;
    S.maxMult=Math.max(S.maxMult,mult());}
  for(const c of coins){if(!c.active)continue;c.g.position.z+=dz;
    c.g.rotation.y+=3*dt;c.g.position.y=c.baseY+Math.sin(S.t*3+c.ph)*.15;
    if(c.g.position.z>20){c.active=false;c.g.visible=false;continue;}
    if(playing&&Math.abs(c.g.position.x-S.px)<1.5&&Math.abs(c.g.position.z)<2.2&&
       Math.abs((S.py+.9)-c.g.position.y)<1.9){
      c.active=false;c.g.visible=false;S.coins++;S.combo++;S.comboT=3.5;
      const v=Math.round(100*mult());S.score+=v;
      burst(c.g.position,0xffd23f,7,5,.5,10,.12);
      floater(c.g.position,'+'+v,'gold');sfx.coin();}}
  for(const n of nitroCans){if(!n.active)continue;n.g.position.z+=dz;
    n.g.rotation.y+=2.4*dt;n.g.position.y=1.1+Math.sin(S.t*2.6+n.ph)*.18;
    if(n.g.position.z>20){n.active=false;n.g.visible=false;continue;}
    if(playing&&Math.abs(n.g.position.x-S.px)<1.6&&Math.abs(n.g.position.z)<2.2&&S.py<2){
      n.active=false;n.g.visible=false;S.nitro=Math.min(100,S.nitro+38);
      floater(n.g.position,t('nitroP')+' +38','cyan');sfx.nitro();
      if(S.nitro>=100)toast(t('nitroFull'));}}
  if(shieldOrb.active){shieldOrb.g.position.z+=dz;shieldOrb.ring.rotation.x+=2*dt;
    shieldOrb.ring.rotation.y+=1.4*dt;shieldOrb.g.position.y=1.2+Math.sin(S.t*2.4)*.18;
    if(shieldOrb.g.position.z>20){shieldOrb.active=false;shieldOrb.g.visible=false;}
    else if(playing&&Math.abs(shieldOrb.g.position.x-S.px)<1.6&&Math.abs(shieldOrb.g.position.z)<2.2&&S.py<2){
      shieldOrb.active=false;shieldOrb.g.visible=false;S.shield=true;P.shield.visible=true;
      el.shieldBox.style.display='block';floater(shieldOrb.g.position,I.shield,'cyan');sfx.shield();}}
  for(const r of ramps){if(!r.active)continue;r.g.position.z+=dz;
    if(r.g.position.z>25){r.active=false;r.g.visible=false;continue;}
    if(playing&&!r.used&&S.py<.5&&S.speed>10&&
       Math.abs(r.g.position.x-S.px)<1.8&&Math.abs(r.g.position.z)<3.2){
      r.used=true;S.vy=7.5+S.speed*.16;S.py=.1;sfx.whoosh();
      floater(_v.set(S.px,2,-2),t('launch'),'gold');}}
  for(const c of cones){if(!c.active)continue;
    if(c.hit){c.vy-=18*dt;c.x+=c.vx*dt;c.z+=dz*.5;c.vx*=.98;c.y+=c.vy*dt;
      c.g.position.set(c.x,Math.max(0,c.y),c.z);
      c.g.rotation.x+=c.vr*dt;c.g.rotation.z+=c.vr*.7*dt;
      if(c.z>25){c.active=false;c.g.visible=false;}}
    else{c.g.position.z+=dz;c.z=c.g.position.z;
      if(c.g.position.z>25){c.active=false;c.g.visible=false;continue;}
      if(playing&&S.py<.8&&Math.abs(c.g.position.x-S.px)<1.3&&Math.abs(c.g.position.z)<1.5){
        c.hit=true;c.vy=rnd(5,8);c.vx=(c.g.position.x>S.px?1:-1)*rnd(4,7);c.y=0;c.vr=rnd(6,12);
        S.score=Math.max(0,S.score-50);S.shake=Math.max(S.shake,.35);S.combo=0;
        floater(c.g.position,'-50','red');sfx.thud();}}}
  P.g.position.set(S.px,S.py,0);
  if(S.mode==='crashed'){S.crashT+=raw;S.py=Math.max(0,S.py+S.vy*raw);S.vy-=20*raw;
    P.tilt.rotation.z+=S.tumble*raw;P.tilt.rotation.x+=S.tumble*.5*raw;
    P.g.position.y=S.py;
    if(S.crashT>1.5)gameOver();}
  else{
    P.tilt.rotation.z=clamp(-S.pvx*.028,-.2,.2);
    P.tilt.rotation.y=clamp(S.pvx*.03,-.25,.25);
    P.tilt.rotation.x=clamp((target-S.speed)*.008,-.06,.06);
    P.tilt.position.y=Math.sin(S.t*14)*.012*Math.min(1,S.speed/20);}
  P.tailMat.emissiveIntensity=brake?2.8:.9;
  P.blinkL.emissiveIntensity=inL&&Math.floor(S.t*5)%2?2.4:.1;
  P.blinkR.emissiveIntensity=inR&&Math.floor(S.t*5)%2?2.4:.1;
  P.shield.rotation.y+=dt*1.5;
  const streakOn=S.nitroOn||S.speed>36;
  streakMat.opacity=streakOn?clamp((S.speed-30)/20,.15,.5)+(S.nitroOn?.25:0):0;
  if(streakOn&&Math.random()<dt*40){for(const s of streaks){if(s.active)continue;
    s.active=true;s.m.visible=true;
    s.m.position.set((Math.random()<.5?-1:1)*rnd(3,11),rnd(.4,4.5),-rnd(10,70));break;}}
  for(const s of streaks){if(!s.active)continue;s.m.position.z+=S.speed*2.6*dt;
    if(s.m.position.z>12){s.active=false;s.m.visible=false;}}
  for(const b of bursts){if(!b.active)continue;b.t+=dt;
    b.m.position.addScaledVector(b.v,dt);b.v.y-=b.grav*dt;
    const k=1-b.t/b.life;if(k<=0){b.active=false;b.m.visible=false;continue;}
    b.m.scale.set(b.size*k+.02,b.size*k+.02,b.size*k+.02);
    b.m.rotation.x+=b.spin*dt;b.m.rotation.y+=b.spin*dt;}
  S.shake*=Math.exp(-5*raw);
  const fovT=58+S.speed*.28+(S.nitroOn?6:0);
  camera.fov+=(fovT-camera.fov)*Math.min(1,raw*5);camera.updateProjectionMatrix();
  const sh=S.shake;
  camera.position.set(
    S.px*.62+rnd(-1,1)*sh*.3,
    4.6+S.py*.55+S.speed*.02+rnd(-1,1)*sh*.3,
    9.2);
  camera.lookAt(S.px*.85,1.4+S.py*.5,-10);
  setEngine(S.speed/46,S.nitroOn);
  updateHUD();}
function updateHUD(){
  el.score.textContent=Math.floor(S.score);
  const kmh=Math.round(S.speed*3.6);
  el.spd.textContent=kmh;
  const r=clamp(kmh/240,0,1);
  el.gArc.setAttribute('stroke-dashoffset',169.6*(1-r));
  el.gArc.setAttribute('stroke',S.nitroOn?'#41e0ff':'#ffb03a');
  el.gNeedle.setAttribute('transform',`rotate(${-90+180*r} 66 66)`);
  el.dist.textContent=(S.dist/1000).toFixed(2)+' km';
  el.nitroFill.style.width=S.nitro+'%';
  el.tNitro.classList.toggle('ready',S.nitro>25&&!S.nitroOn);
  el.tNitro.classList.toggle('empty',S.nitro<8);
  el.nitrofx.classList.toggle('on',S.nitroOn);
  if(S.combo>1){el.comboBox.style.display='block';
    const txt=t('combo')+' ×'+mult().toFixed(1);
    if(el.comboV.textContent!==txt){el.comboV.textContent=txt;
      el.comboBox.classList.remove('pop');void el.comboBox.offsetWidth;el.comboBox.classList.add('pop');}}
  else el.comboBox.style.display='none';}

/* ══════════ 主循环（主菜单=纯色静止画面，不跑模拟） ══════════ */
const clock=new THREE.Clock();
let demoInit=false;
function loop(){
  requestAnimationFrame(loop);
  const raw=Math.min(clock.getDelta(),.05);
  if(!demoInit){demoInit=true;resetRun();S.mode='menu';}
  if(S.mode==='count'){
    S.cdT-=raw;const n=Math.ceil(S.cdT-.4);
    if(S.cdT<=0){S.mode='play';el.count.textContent='GO!!';
      el.count.classList.add('go');el.count.classList.remove('zoom');void el.count.offsetWidth;
      el.count.classList.add('zoom');sfx.beep(true);
      setTimeout(()=>{el.count.style.display='none';el.count.classList.remove('go');},700);}
    else if(n!==S.cdNum&&n>0){S.cdNum=n;el.count.textContent=n;
      el.count.classList.remove('zoom');void el.count.offsetWidth;el.count.classList.add('zoom');sfx.beep(false);}
    updateWorld(0.0001,raw);
  }else if(S.mode==='play'||S.mode==='crashed'){
    const dt=raw*S.timescale;updateWorld(dt,raw);
  }else{
    /* menu / pause / over：世界完全冻结，无任何输入效果 */
    streakMat.opacity=0;el.nitrofx.classList.remove('on');
  }
  renderer.render(scene,camera);}
/* 初始场景布置（静止背景，仅渲染用） */
for(let i=0;i<70;i++){spawnDecor();
  for(const type in decor)for(const it of decor[type])if(it.active)it.g.position.z=rnd(-150,40);}
for(let i=0;i<6;i++)spawnPost();
posts.forEach(p=>{if(p.active)p.g.position.z=rnd(-140,30);});
for(let i=0;i<6;i++)spawnLamp();
decor.lamp.forEach(l=>{if(l.active)l.g.position.z=rnd(-150,30);});
applyPhase(.015);
window.__srBoot=true;
loop();
})();
</script>
